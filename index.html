<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sobrevivendo uma noite no minecraft</title>
    <link rel="shortcut icon" href="https://i.postimg.cc/4dhf2XcR/favicon.png" type="image/png">
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            background-color: black;
            color: chartreuse;
        }

        #game-container{
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 2px solid white;
            background-color: #222;
            border-radius: 10px;
        }

        img{
            width: 100%;
            border-radius: 10px;
        }

        .choice{
            display: block;
            margin: 10px auto;
            padding: 10px;
            width: 80%;
            font-size:18px;
            cursor: pointer;
            background-color: red;
            color:white;
            border: none;
            border-radius: 5px;

        }
    </style>
</head>
<body>
    <div id="game-container">
        <h2 id = "title"></h2>sobrevivendo uma noite no minecraft</h2></h2>
        <img id="scene-img" src="CENA1.png" alt="Cena do jogo">
        <p id="story">voce derrepente acorda no minecraft oque faria?</p>
        <button class="choice" onclick="escolha('procurar')">procurar uma vila</button>
        <button class="choice" onclick="escolha('pegar')">pegar recursos</button>
        

    </div>

    <script>
        function escolha(opcao){
            let titulo = document.getElementById("title");
            let imagem = document.getElementById("scene-img");
            let historia = document.getElementById("story");
            let botoes = document.querySelectorAll(".choice");
            
            if (opcao === "procurar") {
                titulo.innerText = "voce encontrou uma vila!";
                imagem.src = "CENA 1.1.png";
                historia.innerText = "você encontrou a vila você tem 2 opções qual escolheria?";
                botoes[0].innerText = "matar o iron golem";
                botoes[0].setAttribute("onclick", "escolha('matar')");
                botoes[1].innerText = "pegar feno";
                botoes[1].setAttribute("onclick", "escolha('feno')");

            }
            else if (opcao === "pegar") {
                titulo.innerText = "ferramentas de pedra";
                imagem.src = "CENA 1.2.png";
                historia.innerText = "você pegou recursos novos tem 2 opçoes qual escolheria";
                botoes[0].innerText = "construir uma casa";
                botoes[0].setAttribute("onclick", "escolha('construir')");
                botoes[1].innerText = "pegar recursos melhores";
                botoes[1].setAttribute("onclick", "escolha('recursos')");

            }
            else if (opcao === 'matar') {
              titulo.innerText = "o iron golem te esmagou";
              imagem.src = "CENA 2.1.png";
              historia.innerText = "o iron golem vence! você erra contra a batalha com o iron golem.";
              botoes.forEach(botao => botao.style.display = "none");
            }
            else if (opcao === 'feno') {
              titulo.innerText = "você conseguiu agora você voltou a vida real!";
              imagem.src = "CENA 2.2.png";
              historia.innerText = "você dorme em uma casa de vilager sem fome e acorda na vida real!";
              botoes.forEach(botao => botao.style.display = "none");
            }
            else if (opcao === 'construir') {
              titulo.innerText = "você conseguiu voltar a vida real mas esta com muita fome e esta cansado"
              imagem.src = "CENA 2.3.png";
              historia.innerText = "você faz sua casa e consegue dormir tranquilamente";
              botoes.forEach(botao => botao.style.display = "none");
            }
            else if (opcao === 'recursos') {
              titulo.innerText = "voce morre em uma caverna lutando contra um esqueleto"
              imagem.src = "CENA 2.4.png";
              historia.innerText = "você vai pegar mais recursos e acaba encontrando uma caverna e morre pra um esqueleto";
              botoes.forEach(botao => botao.style.display = "none");
            }


        }
    </script>
</body>
</html>
